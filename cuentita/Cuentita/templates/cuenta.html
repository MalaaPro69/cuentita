<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuentita | Seguridad de cuenta</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        .auth-card h1 { margin: 24px 0 8px; font-size: 1.75rem; line-height: 1.2; }
        .auth-card #accountDescription { margin: 0 0 24px; line-height: 1.5; }
        .auth-card form { gap: 16px; }
        .auth-card form[hidden] { display: none; }
        .auth-card input { min-height: 46px; margin-top: 7px; }
        .auth-card button { min-height: 46px; transition: filter .16s ease, transform .16s ease; }
        .auth-card button:hover { filter: brightness(1.06); }
        .auth-card button:active { transform: translateY(1px); }
        .auth-card button:focus-visible, .auth-card input:focus-visible, .auth-card a:focus-visible { outline: 3px solid #8b9cf5; outline-offset: 3px; }
        .auth-card #accountStatus:empty { display: none; }
        .auth-card #accountStatus:not(:empty) { padding: 12px; margin: 18px 0 0; border-radius: 8px; background: #f3f5ff; line-height: 1.45; }
        .auth-card > p:last-child { margin-top: 28px; }
        .auth-card button:disabled { opacity: .55; cursor: not-allowed; filter: none; }
        @media (max-width: 480px) {
            .auth-card { padding: 26px 20px; }
            .auth-card h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body class="auth-body">
    <main class="auth-card">
        <div class="brand">Cuentita</div>
        <h1 id="accountTitle">Seguridad de cuenta</h1>
        <p id="accountDescription" class="muted"></p>

        <form id="recoveryForm" action="/solicitar-recuperacion" hidden>
            <label>Email<input name="email" type="email" required autocomplete="email"></label>
            <button type="submit">Enviar instrucciones</button>
        </form>

        <form id="resendForm" action="/reenviar-verificacion" hidden>
            <label>Email<input name="email" type="email" required autocomplete="email"></label>
            <button type="submit">Reenviar enlace</button>
        </form>

        <form id="verifyForm" action="/confirmar-email" hidden>
            <button type="submit">Confirmar correo</button>
        </form>

        <form id="resetForm" action="/restablecer" hidden>
            <label>Nueva contraseña<input name="password" type="password" minlength="12" required autocomplete="new-password"></label>
            <button type="submit">Guardar contraseña</button>
        </form>

        <p id="accountStatus" class="status" role="status" aria-live="polite"></p>
        <p class="muted"><a href="/login">Volver al inicio de sesión</a></p>
    </main>
    <script src="/static/js/cuenta.js"></script>
</body>
</html>
