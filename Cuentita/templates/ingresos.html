<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cuentita | Ingresos</title><link rel="stylesheet" href="/static/css/app.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body><main class="container"><header class="topbar"><div class="brand">Cuentita</div><nav><a href="/menu">Menú</a><a href="/dashboard">Gastos</a><a class="active" href="/ingresos">Ingresos</a><a href="/inversiones">Inversiones</a><button class="logout" onclick="logout()">Salir</button></nav></header><section class="layout"><div class="card"><h1>Ingresos</h1><p class="muted">Registrá el dinero que entra y su motivo.</p><form id="entryForm"><label>Motivo<input id="motivo" required placeholder="Ej: Sueldo"></label><label>Monto<input id="monto" type="number" min="0.01" step="0.01" required></label><button>Guardar ingreso</button></form><p id="status" class="status"></p></div><div class="card"><label>Mes a consultar<input id="monthFilter" type="month"></label><section class="stats"><div class="metric"><small>Ingresado</small><strong id="total">$0</strong></div><div class="metric"><small>Gastado</small><strong id="spent">$0</strong></div><div class="metric"><small>Saldo</small><strong id="balance">$0</strong></div></section><canvas id="mainChart"></canvas><div id="records" class="records"></div></div></section></main><script src="/static/js/common.js"></script><script src="/static/js/ingresos.js"></script></body></html>
