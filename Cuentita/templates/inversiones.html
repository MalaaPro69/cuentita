<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cuentita | Inversiones</title><link rel="stylesheet" href="/static/css/app.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body><main class="container"><header class="topbar"><div class="brand">Cuentita</div><nav><a href="/menu">Menú</a><a href="/dashboard">Gastos</a><a href="/ingresos">Ingresos</a><a class="active" href="/inversiones">Inversiones</a><button class="logout" onclick="logout()">Salir</button></nav></header><section class="layout"><div class="card"><h1>Mi cartera</h1><p class="muted">Valores expresados en USD.</p><form id="investmentForm"><input type="hidden" id="editingId"><label>Activo<input id="activo" required placeholder="Bitcoin, CEDEAR de Apple"></label><label>Símbolo<input id="simbolo" placeholder="BTC, ETH, AAPL"></label><label>Cantidad<input id="cantidad" type="number" min="0.00000001" step="any" required></label><label>Precio actual por unidad (USD)<input id="precioActual" type="number" min="0" step="0.01" required></label><label>Rendimiento estimado (%)<input id="rendimiento" type="number" step="0.01"></label><button id="saveButton">Agregar inversión</button><button id="cancelButton" type="button" class="secondary" hidden>Cancelar</button></form><p id="status" class="status"></p></div><div class="card"><div class="stats"><div class="metric"><small>Valor total</small><strong id="total">US$ 0</strong></div><div class="metric"><small>Activos</small><strong id="count">0</strong></div><div class="metric"><small>Ganancia estimada</small><strong id="profit">US$ 0</strong></div></div><button id="refreshQuotes">Actualizar cotizaciones</button><canvas id="portfolioChart"></canvas></div></section><section class="card"><h2>Activos de la cartera</h2><div id="portfolio" class="portfolio"></div></section></main><script src="/static/js/common.js"></script><script src="/static/js/inversiones.js"></script></body></html>
